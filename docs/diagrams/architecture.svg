<text x="48" y="58" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Obsidian Disassembler</text><text x="48" y="84" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Layered architecture · one-way dependencies</text><rect x="390" y="128" width="500" height="92" rx="10" fill="#2d2d30" stroke="#4fa3e3" stroke-width="1.2"/><text x="412" y="158" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Obsidian.App</text><text x="412" y="182" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">WPF · MVVM · AvalonDock · documents</text><text x="412" y="202" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">overview · hex · disassembly · graphs · browser</text><rect x="60" y="292" width="260" height="116" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="78" y="322" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Obsidian.Pe</text><text x="78" y="348" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">AsmResolver loader</text><text x="78" y="370" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">PE → immutable BinaryImage</text><path d="M 640 220 C 640 255, 190 255, 190 292" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="350" y="292" width="260" height="116" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="368" y="322" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Obsidian.Disassembly</text><text x="368" y="348" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">Iced x86/x64 decoder</text><text x="368" y="370" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">instructions + patch preview</text><path d="M 640 220 C 640 255, 480 255, 480 292" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="640" y="292" width="260" height="116" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="658" y="322" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Obsidian.Analysis</text><text x="658" y="348" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">seed traversal</text><text x="658" y="370" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">functions · CFG · xrefs · strings</text><path d="M 640 220 C 640 255, 770 255, 770 292" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="930" y="292" width="260" height="116" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="948" y="322" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Obsidian.Projects</text><text x="948" y="348" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">SQLite project store</text><text x="948" y="370" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">annotations · bookmarks · patches</text><path d="M 640 220 C 640 255, 1060 255, 1060 292" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="190" y="486" width="900" height="92" rx="10" fill="#2d2d30" stroke="#4fa3e3" stroke-width="1.2"/><text x="212" y="516" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Obsidian.Core</text><text x="212" y="540" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">BinaryImage · AddressMap · disassembly models · analysis models · project contracts</text><text x="212" y="560" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">no WPF · no Iced · no AsmResolver · no SQLite</text><path d="M 190 408 C 190 448, 640 448, 640 486" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 480 408 C 480 448, 640 448, 640 486" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 770 408 C 770 448, 640 448, 640 486" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 1060 408 C 1060 448, 640 448, 640 486" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="48" y="620" width="1184" height="54" rx="8" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="68" y="651" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">solid arrow</text><text x="148" y="651" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="400">depends on</text><text x="300" y="651" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">·</text><text x="322" y="651" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">UI depends on services; services depend on Core, never the reverse.</text><text x="48" y="700" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="400">Obsidian Disassembler · docs/diagrams/architecture.svg</text>
