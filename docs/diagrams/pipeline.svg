<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">Analysis pipeline diagram</title>
<desc id="desc">Pipeline from PE file to views</desc>
<rect width="1280" height="700" rx="16" fill="#1e1e1e"/>
<rect x="0.5" y="0.5" width="1279" height="699" rx="16" fill="none" stroke="#3f3f46"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d9d9d"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fa3e3"/>
  </marker>
</defs>

<text x="48" y="58" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Analysis pipeline</text><text x="48" y="84" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">From file bytes to navigable results</text><rect x="48" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="64" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">01</text><text x="64" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Open PE</text><text x="64" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">validate MZ/PE</text><text x="64" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">read bytes</text><text x="64" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">SHA-256</text><path d="M 234 218 L 243 218" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="246" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="262" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">02</text><text x="262" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Parse</text><text x="262" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">headers · sections</text><text x="262" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">directories · imports</text><text x="262" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">exports</text><path d="M 432 218 L 441 218" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="444" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="460" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">03</text><text x="460" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Disassemble</text><text x="460" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">Iced x86/x64</text><text x="460" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">linear sweep</text><text x="460" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">1M cap</text><path d="M 630 218 L 639 218" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="642" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="658" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">04</text><text x="658" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Discover</text><text x="658" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">entry · exports · calls</text><text x="658" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">exception · TLS</text><text x="658" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">basic blocks</text><path d="M 828 218 L 837 218" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="840" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="856" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">05</text><text x="856" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Index</text><text x="856" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">xrefs · strings</text><text x="856" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">call graph</text><text x="856" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">analysis model</text><path d="M 1026 218 L 1035 218" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="1038" y="140" width="184" height="156" rx="10" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="1054" y="172" fill="#4fa3e3" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="600">06</text><text x="1054" y="202" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Present</text><text x="1054" y="230" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">overview · hex</text><text x="1054" y="248" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">disassembly · CFG</text><text x="1054" y="266" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">browser · call graph</text><rect x="48" y="340" width="1184" height="94" rx="10" fill="#2d2d30" stroke="#3f3f46" stroke-width="1.2"/><text x="68" y="370" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Immutable hand-off</text><text x="68" y="396" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">BinaryImage  →  DisassemblyImage  →  AnalysisResult  →  view models</text><text x="68" y="416" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">Every stage receives a completed immutable result; UI never decodes or mutates domain data.</text><rect x="48" y="468" width="380" height="92" rx="8" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="64" y="496" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Deterministic</text><text x="64" y="520" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">same binary + same seeds</text><text x="64" y="540" fill="#4ec9b0" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">same result</text><rect x="446" y="468" width="380" height="92" rx="8" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="462" y="496" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Cancellable</text><text x="462" y="520" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">all long stages accept</text><text x="462" y="540" fill="#4ec9b0" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">a cancellation token</text><rect x="844" y="468" width="380" height="92" rx="8" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="860" y="496" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Explicit</text><text x="860" y="520" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">truncation · unsupported arch</text><text x="860" y="540" fill="#4ec9b0" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="400">parse errors surfaced</text><text x="48" y="676" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="400">Obsidian Disassembler · docs/diagrams/pipeline.svg</text>
</svg>
