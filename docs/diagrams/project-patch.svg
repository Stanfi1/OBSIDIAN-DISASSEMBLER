<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="704" viewBox="0 0 1280 704" role="img" aria-labelledby="title desc">
<title id="title">Project and patch lifecycle diagram</title>
<desc id="desc">Safe patch replay lifecycle</desc>
<rect width="1280" height="704" rx="16" fill="#1e1e1e"/>
<rect x="0.5" y="0.5" width="1279" height="703" rx="16" fill="none" stroke="#3f3f46"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9d9d9d"/>
  </marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fa3e3"/>
  </marker>
</defs>

<text x="48" y="58" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Project and patch lifecycle</text><text x="48" y="84" fill="#9d9d9d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">The original binary is always read-only</text><rect x="56" y="132" width="300" height="90" rx="10" fill="#2d2d30" stroke="#3f3f46" stroke-width="1.2"/><text x="76" y="162" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Original binary</text><text x="76" y="186" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">read-only · SHA-256</text><text x="76" y="204" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">never opened for write</text><rect x="490" y="132" width="300" height="90" rx="10" fill="#2d2d30" stroke="#3f3f46" stroke-width="1.2"/><text x="510" y="162" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Project (.obsproj)</text><text x="510" y="186" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">annotations · bookmarks</text><text x="510" y="204" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">ordered patch operations</text><rect x="924" y="132" width="300" height="90" rx="10" fill="#2d2d30" stroke="#3f3f46" stroke-width="1.2"/><text x="944" y="162" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Save patched copy</text><text x="944" y="186" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">explicit export</text><text x="944" y="204" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">new file, never source</text><path d="M 356 177 L 486 177" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><path d="M 790 177 L 920 177" fill="none" stroke="#9d9d9d" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="360" y="292" width="560" height="100" rx="10" fill="#252526" stroke="#4fa3e3" stroke-width="1.2"/><text x="384" y="324" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Replay patches on a fresh base image</text><text x="384" y="350" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">base bytes → patch 1 → patch 2 → … → patched in-memory bytes</text><text x="384" y="370" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">each operation stores RVA, file offset, original and patched bytes</text><path d="M 640 222 L 640 288" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="290" y="442" width="700" height="84" rx="10" fill="#2d2d30" stroke="#3f3f46" stroke-width="1.2"/><text x="312" y="472" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Disassembly and analysis on the patched image</text><text x="312" y="498" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">Iced sweep → seed functions → CFG · xrefs · strings · graphs</text><path d="M 640 392 L 640 438" fill="none" stroke="#4fa3e3" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="56" y="560" width="1168" height="84" rx="8" fill="#252526" stroke="#3f3f46" stroke-width="1.2"/><text x="76" y="588" fill="#f1f1f1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Safety invariants</text><text x="76" y="612" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">✓ same-length replacement only   ✓ Iced preview validates one instruction   ✓ undo/redo replays from base bytes</text><text x="76" y="632" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="400">✓ project open verifies original SHA-256   ✓ closing with unsaved changes prompts Save / Discard / Cancel</text><text x="48" y="684" fill="#9d9d9d" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="400">Obsidian Disassembler · docs/diagrams/project-patch.svg</text>
</svg>
